<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Equipamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="container">
        <h1>Editar Equipamento</h1>
        
        <div class="form-container">
            <form action="{{ url_for('process_update', id=equipamento['id']) }}" method="post">
                <!-- Formulário atualizado com todos os novos campos -->
                <input type="text" placeholder="Projeto" name="projeto" required value="{{ equipamento['projeto'] or '' }}">
                <input type="text" placeholder="Usuário Responsável" name="usuario" value="{{ equipamento['usuario'] or '' }}">
                <input type="text" placeholder="OLT Hostname" name="olt_hostname" value="{{ equipamento['olt_hostname'] or '' }}">
                <input type="text" placeholder="OLT IP" name="olt_ip" value="{{ equipamento['olt_ip'] or '' }}">
                <input type="number" placeholder="Slot" name="slot" class="numeric-only" value="{{ equipamento['slot'] or '' }}">
                <input type="number" placeholder="Porta" name="porta" class="numeric-only" value="{{ equipamento['porta'] or '' }}">
                <input type="number" placeholder="ONT ID" name="ont_id" class="numeric-only" value="{{ equipamento['ont_id'] or '' }}">
                <input type="text" placeholder="Serial GPON" name="serial_gpon" required value="{{ equipamento['serial_gpon'] or '' }}">
                
                <select name="tipo_cliente" required>
                    <option value="" {% if not equipamento['tipo_cliente'] %}selected{% endif %}>Tipo de Cliente</option>
                    <option value="B2C" {% if equipamento['tipo_cliente'] == 'B2C' %}selected{% endif %}>B2C</option>
                    <option value="B2B" {% if equipamento['tipo_cliente'] == 'B2B' %}selected{% endif %}>B2B</option>
                </select>

                <select name="tipo_servico" required>
                    <option value="" {% if not equipamento['tipo_servico'] %}selected{% endif %}>Tipo de Serviço</option>
                    <option value="Internet" {% if equipamento['tipo_servico'] == 'Internet' %}selected{% endif %}>Internet</option>
                    <option value="VOIP" {% if equipamento['tipo_servico'] == 'VOIP' %}selected{% endif %}>VOIP</option>
                    <option value="VOD" {% if equipamento['tipo_servico'] == 'VOD' %}selected{% endif %}>VOD</option>
                    <option value="VPN" {% if equipamento['tipo_servico'] == 'VPN' %}selected{% endif %}>VPN</option>
                </select>

                <input type="number" placeholder="SVLAN" name="svlan" class="numeric-only" value="{{ equipamento['svlan'] or '' }}">
                <input type="number" placeholder="CVLAN" name="cvlan" class="numeric-only" value="{{ equipamento['cvlan'] or '' }}">
                
                <select name="status">
                    <option value="Disponível" {% if equipamento['status'] == 'Disponível' %}selected{% endif %}>Disponível</option>
                    <option value="Em Uso" {% if equipamento['status'] == 'Em Uso' %}selected{% endif %}>Em Uso</option>
                    <option value="Em Manutenção" {% if equipamento['status'] == 'Em Manutenção' %}selected{% endif %}>Em Manutenção</option>
                </select>

                <input type="text" placeholder="Observação" name="observacao" class="input-full-width" value="{{ equipamento['observacao'] or '' }}">
                <button type="submit">Salvar Alterações</button>
            </form>
        </div>
    </div>
</body>
</html>
